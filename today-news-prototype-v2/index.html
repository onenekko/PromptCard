<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><title>事実を言っているだけ</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d8;color:#181716;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;padding:0 8px 118px}.top{position:sticky;top:0;background:#fffdf7ee;z-index:4;padding:10px;border-bottom:3px double #222}.top b{font-family:serif;font-size:24px}.day{float:right;font-size:11px;color:#777}.brief,.echo,.card{max-width:720px;margin:8px auto;padding:11px;background:#fff}.brief{border-left:4px solid #1d3f61}.echo{border-left:4px solid #8b1f1f;font-family:serif;line-height:1.6}.kind{font:700 10px sans-serif;color:#777}.card{border:1px solid #ccc}.sec{font-size:11px;color:#8b1f1f;font-weight:800}.card h2{font:900 20px/1.35 serif;margin:5px 0}.meta,.note{font-size:11px;color:#716b62}.body{font:14px/1.7 serif;margin:8px 0}.note{background:#f3eee4;padding:7px}.btns{display:flex;gap:7px;margin-top:9px}button{min-height:46px;border:1px solid #bbb;border-radius:8px;font-weight:750}.pick{flex:1}.a{background:#8b1f1f;color:#fff}.b{background:#1d3f61;color:#fff}.tray{position:fixed;left:0;right:0;bottom:0;background:#fffdf7f5;padding:7px 9px calc(7px + env(safe-area-inset-bottom));z-index:8;box-shadow:0 -5px 18px #0002}.slots{display:grid;grid-template-columns:1fr 1fr;gap:5px}.slot{height:38px;border:1px solid #ccc;padding:4px;font-size:9px;overflow:hidden}.slot b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pub,.go{width:100%;background:#191919;color:#fff;border:0;margin-top:6px}.pub:disabled{opacity:.3}.cover{position:fixed;inset:0;background:#17130fcc;z-index:20;display:flex;align-items:flex-end}.modal{background:#fffdf7;width:100%;max-height:90dvh;overflow:auto;padding:20px 16px calc(18px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}.modal h1{font:900 27px/1.3 serif;margin:0 0 8px}.modal p{line-height:1.7;font-size:14px}.go{background:#8b1f1f}.paper{font:900 19px/1.4 serif;border-top:4px double #222;padding:9px 0}.hidden{display:none!important}
</style><div class=top><span class=day id=day></span><b>事実を言っているだけ</b><div id=brief></div></div><div id=echo></div><main id=cards></main><div class=tray><div class=slots><div class=slot>一面<b id=s1>未選択</b></div><div class=slot>二番手<b id=s2>未選択</b></div></div><button class=pub id=pub disabled>この紙面で発行する</button></div><div class=cover id=intro><div class=modal><h1>事実を言っているだけ</h1><p>5日間だけ編集長になる。毎日5本、載せられるのは2本。</p><p>嘘を書く必要はない。<b>どの事実を、どれだけ大きく言うか</b>を決めるだけだ。</p><p>評価メーターはない。翌日の街、電話、続報、そして届かなくなった情報が返事になる。</p><button class=go id=start>編集部に入る</button></div></div><div class='cover hidden' id=result><div class=modal id=box></div></div><script>
var g={d:0,s:[null,null],f:{},hist:[],echo:[]},$=function(x){return document.getElementById(x)};
var D=[
['月曜。市長が北岸再開発を発表。最初の紙面を決める。',[
['市政','北岸再開発、ノヴァが新工場','市長会見／ノヴァ広報','雇用800人。市長は「若者が残れる街に」。企業は環境配慮型設備を強調。','市の今期最大案件。','mayor'],
['地域','川沿いで魚の大量死　原因不明','釣り人／清掃員','北岸の排水口下流で小魚が多数浮く。市は「異常報告なし」。原因は不明。','水野記者は「一応、水を採っておきます」。','fish'],
['事件','駅前で財布抜き相次ぐ？','SNS投稿／被害届未確認','黒い帽子の男にぶつかられ財布が消えた、という投稿が拡散。顔写真も出回る。','警察確認はまだ取れていない。','theft'],
['街','亀屋ベーカリー、創業50年','店主／常連客','北岸商店街の小さな店。先代のあんバターを今も焼く。','店主「最近は客が減った」。','bread'],
['生活','今夜から激しい雨','気象台','深夜から強い雨。北岸など低地では浸水と河川増水に注意。','市は自主避難所をまだ開けない。','rain']]],
['火曜。昨夜は強い雨。朝から編集部の電話が鳴っている。',[]],['水曜。北岸の出来事が、少しずつつながって見える。',[]],['木曜。ノヴァから広告契約について連絡。水野記者は徹夜明け。',[]],['金曜。今週の断片をどう紙面にするか、最後の判断。',[]]];
function A(a,b,c,d,e,f){return[a,b,c,d,e,f]}function H(x){return!!g.f[x]}
function arts(d){var a;if(d==0)return D[0][1];if(d==1){a=[];a.push(H('fish')?A('調査','北岸の水から溶剤成分','大学研究室','水野記者が採った水から工業用溶剤成分を微量検出。発生源は未特定。','昨日の記事を見た研究者が分析を申し出た。','water'):A('地域','魚大量死、市「豪雨の影響も」','市環境課','豪雨による酸欠の可能性。最初の水は採取されていない。','他紙は小さく扱った。','lost'));a.push(A('生活','北岸第二小で児童11人が腹痛','学校／保護者','11人が早退。全員軽症、原因不明。','保護者「給食業者も調べて」。','school'));a.push(H('theft')?A('事件','「黒い帽子の男」勤務先を休む','本人の弁護士','写真を拡散された男性が出勤できず。犯人との裏付けはない。','写真を使ったのは本紙を含む3媒体。','harm'):A('事件','財布抜き、確認被害は1件','警察','複数被害の噂に対し確認された届けは1件。','黒い帽子の男性の裏付けなし。','correct'));a.push(H('bread')?A('街','亀屋、記事を見た客で完売','現地','朝から行列。店主「新聞ってまだ人を呼ぶんですね」。','昨日の紙面が店に貼られた。','bread2'):A('街','北岸商店街、また1店閉店へ','商店会','衣料品店が今月末で閉店。','亀屋も売上減が続く。','close'));a.push(H('rain')?A('生活','自主避難所に43人　大きな被害なし','市／避難者','「新聞を見て早めに来た」という家族もいた。','床上浸水なし。','evac'):A('生活','北岸で床下浸水7棟','市','避難所開設は午前2時過ぎ。けが人なし。','住民「もっと早く知らせて」。','flood'));return a}
if(d==2){a=[];a.push(H('school')?A('調査','給食業者、ノヴァ系列と判明','法人登記','給食業者は3年前にノヴァの完全子会社に。腹痛との因果は未確認。','昨日の保護者の電話から調べた。','supplier'):A('生活','児童の腹痛、全員回復','保健所','食中毒の可能性は低い。原因は未特定。','続報は小さい。','recover'));a.push(H('mayor')?A('市政','市長後援会にノヴァ幹部から300万円','政治資金報告書','昨年、役員3人から計300万円。市長側は適正な寄付と説明。','匿名封筒でページ番号が届いた。','donation'):A('市政','再開発の住民説明会、来月開催','市','工場計画の詳細を説明予定。','市長とノヴァの関係はまだ話題になっていない。','meeting'));a.push(H('harm')?A('社会','「黒い帽子の男」へ謝罪広がる','本人／SNS','写真を拡散した複数アカウントが削除・謝罪。','男性「謝罪記事なら顔は載せないで」。','apology'):A('事件','駅前窃盗、別の容疑者を逮捕','警察','防犯カメラから別人を逮捕。','SNSの写真はまだ残る。','arrest'));a.push(H('water')?A('地域','住民62人、市に第三者調査を要求','現地','溶剤記事を受け署名が一晩で62人。','元社員から「排水設備のことで話せる」と電話。','protest'):A('地域','魚大量死、原因特定できず','市','追加調査では異常値なし。最初の水がなく比較不能。','水野「初日に採っていれば」。','lostlead'));a.push(A('街','図書館の迷い猫「部長」正式採用','図書館','募金で健康診断。今週いちばん平和な取材。','写真がとてもいい。','cat'));return a}
if(d==3){a=[];a.push(H('water')&&(H('supplier')||H('donation')||H('protest'))?A('特報','内部文書「旧排水設備、基準超過の恐れ」','元社員／内部文書','豪雨時に基準超過の恐れ、と記された点検表。真正性の最終確認は未完。','元社員「今夜までなら電話に出る」。','memo'):A('調査','ノヴァ旧工場、設備台帳に欠落','市公開資料','排水設備の一部年度が欠落。違法性を示すものではない。','水野「まだ一本の線にはできない」。','gap'));a.push(A('市政','市「健康被害との因果関係なし」','市／保健所','児童腹痛と河川に共通原因を示すデータはない。','これは現時点では事実。','calm'));a.push(A('社内','ノヴァ、本紙広告を再検討','営業部','来月の広告を見直す意向。本紙収入の14％。','営業部長「記事を曲げろとは言わない」。','pressure'));a.push(A('生活','腹痛の児童、全員回復　食中毒否定','保健所','河川との関連も確認されていない。','「つながっている」と断定する根拠はない。','recover2'));a.push(H('harm')?A('社会','誤認拡散された男性、本紙に手紙','本人','「訂正はありがたい。でも検索するとまだ自分の顔が先に出る」。','掲載許可は取れた。','letter'):A('街','亀屋、説明会の日に臨時営業','店主','新聞で街が動くのを初めて見た、と話す。','夜まで営業予定。','bread3'));return a}
a=[];a.push(H('memo')?A('一面候補','北岸の異変、一本の線に','本紙取材','魚、溶剤、企業関係、旧設備文書を時系列で検証。児童腹痛との因果はないと明記。','文書照合と元社員への再確認は完了。','expose'):A('一面候補','北岸で何が起きているのか','本紙取材','確認できた事実と、まだ分からない疑問を整理。','断定できる材料はまだない。','round'));a.push(A('市政','市長「憶測が投資を遠ざける」','市長','雇用と税収効果を強調。','全文掲載の条件で取材。','city'));a.push(A('経済','ノヴァ、旧工場を自主点検へ','ノヴァ','外部機関へ点検を委託。','本紙の質問送付6時間後の発表。','nova'));a.push(A('人物','「川でまた釣りがしたい」通報者は10歳','親子','魚の異変を最初に見つけた小学4年生。','「大人が調べてくれると思った」。','human'));a.push(A('生活','週末、記録的大雨のおそれ','気象台／市','北岸に午後6時から自主避難所。','今度は市も早めに動く。','storm'));return a}
function react(d,p){var id=p.map(function(x){return x.id}),o=[];if(d==0){o.push(id.indexOf('fish')>=0?['情報提供','記事を読んだ研究者から「水を分析できます」と連絡。']:['街','魚の話はSNSで流れたが、本紙には追加情報が来なかった。']);if(id.indexOf('theft')>=0)o.push(['抗議電話','「息子の顔を、なぜ確認もせず載せたんですか」']);if(id.indexOf('bread')>=0)o.push(['街','亀屋の前に朝から行列。']);o.push(id.indexOf('rain')>=0?['読者メール','「新聞を見て母を早めに避難所へ連れていきました」']:['読者メール','「もっと早く避難所を知りたかった」'])}if(d==1){if(id.indexOf('water')>=0)o.push(['市役所','報道を受け、市が追加採水を決定。']);if(id.indexOf('school')>=0)o.push(['情報提供','保護者から給食業者の契約資料が届く。']);if(id.indexOf('harm')>=0)o.push(['編集部','写真掲載への抗議が12件。']);if(id.indexOf('correct')>=0)o.push(['本人','「確認してくれてありがとう。でも写真はもう消えない」'])}if(d==2){if(id.indexOf('supplier')>=0)o.push(['匿名の封筒','ノヴァと市長後援会の政治資金報告書。']);if(id.indexOf('donation')>=0)o.push(['市長室','「合法な寄付を疑惑のように扱うのか」']);if(id.indexOf('protest')>=0)o.push(['元社員','「排水設備のことで話せる」']);if(id.indexOf('cat')>=0)o.push(['街','猫「部長」の記事で図書館の寄付箱が満杯に。'])}if(d==3){o.push(id.indexOf('memo')>=0?['県庁','県が旧工場への立入確認を検討。他紙も追随。']:['取材メモ','元社員の電話は夜につながらなくなった。']);if(id.indexOf('pressure')>=0)o.push(['営業部','ノヴァは広告継続を示唆。水野記者は何も言わない。']);if(id.indexOf('recover2')>=0)o.push(['保護者','河川と腹痛を結ぶ投稿が減った。「違うことは違うと書いてくれてよかった」'])}if(d==4){if(id.indexOf('expose')>=0)o.push(['県の発表','週明けに旧工場へ立入確認。']);if(id.indexOf('round')>=0)o.push(['読者投稿','「分からないままなのも分かった」']);if(id.indexOf('storm')>=0)o.push(['街','北岸では夕方から住民が避難所へ動き始めた。']);if(id.indexOf('human')>=0)o.push(['販売店','「今日はこの子の記事で立ち止まる人が多い」'])}return o}
function render(){$('day').textContent='DAY '+(g.d+1)+' / 5';$('brief').textContent=D[g.d][0];$('echo').innerHTML='';if(g.d)g.echo.forEach(function(e){$('echo').innerHTML+='<div class=echo><div class=kind>'+e[0]+'</div>'+e[1]+'</div>'});var a=arts(g.d);$('cards').innerHTML='';a.forEach(function(x,i){$('cards').innerHTML+='<article class=card><div class=sec>'+x[0]+'</div><h2>'+x[1]+'</h2><div class=meta>情報源：'+x[2]+'</div><div class=body>'+x[3]+'</div><div class=note>'+x[4]+'</div><div class=btns><button class="pick '+(g.s[0]==i?'a':'')+'" onclick="pick('+i+',0)">一面に置く</button><button class="pick '+(g.s[1]==i?'b':'')+'" onclick="pick('+i+',1)">二番手に置く</button></div></article>'});slot()}
function pick(i,s){var o=s?0:1;if(g.s[s]==i)g.s[s]=null;else{if(g.s[o]==i)g.s[o]=null;g.s[s]=i}render()}function slot(){var a=arts(g.d);$('s1').textContent=g.s[0]==null?'未選択':a[g.s[0]][1];$('s2').textContent=g.s[1]==null?'未選択':a[g.s[1]][1];$('pub').disabled=g.s[0]==null||g.s[1]==null}
$('pub').onclick=function(){var a=arts(g.d),p=g.s.map(function(i){return{id:a[i][5],title:a[i][1]}});p.forEach(function(x){g.f[x.id]=1});g.hist.push(p);g.echo=react(g.d,p);$('box').innerHTML='<h1>あなたは、これを街に出した。</h1><div class=paper>一面　'+p[0].title+'</div><div class=paper>二番手　'+p[1].title+'</div><p>評価は表示しない。返事は翌朝に来る。</p><button class=go id=next>'+(g.d<4?'翌朝へ':'土曜の朝へ')+'</button>';$('result').classList.remove('hidden');$('next').onclick=function(){if(g.d<4){g.d++;g.s=[null,null];$('result').classList.add('hidden');render();scrollTo(0,0)}else end()}}
function end(){var t='<h1>五日間が終わった。</h1>';g.echo.forEach(function(e){t+='<div class=echo><div class=kind>'+e[0]+'</div>'+e[1]+'</div>'});if(H('harm'))t+='<div class=paper>黒い帽子の男性の記事は、訂正より長く検索結果に残った。</div>';if(H('bread2'))t+='<div class=paper>亀屋は週末も売り切れた。店主は記事を額に入れた。</div>';if(H('lostlead'))t+='<div class=paper>最初の水は誰にも採取されなかった。後から戻れない一日がある。</div>';t+='<p style="font-family:serif;font-size:17px">「私たちは事実を言っているだけだ」</p><button class=go onclick=location.reload()>別の紙面を作る</button>';$('box').innerHTML=t}
$('start').onclick=function(){$('intro').classList.add('hidden');render()};render();
</script>
