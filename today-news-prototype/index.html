<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>今日のニュース</title><style>
:root{--bg:#ece7dc;--paper:#fffdf7;--ink:#171715;--muted:#6f685d;--line:#cfc7b8;--red:#8d1c1c;--blue:#17395f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:118px}.wrap{max-width:720px;margin:auto;padding:8px}.head{position:sticky;top:0;z-index:5;background:var(--paper);border:1px solid var(--line);padding:10px 12px}.title{font-family:"Yu Mincho",serif;font-weight:900;font-size:28px;border-bottom:3px double #222;padding-bottom:5px}.day{font-size:11px;color:var(--muted);float:right;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.st{text-align:center;border-right:1px solid var(--line);font-size:10px;color:var(--muted)}.st:last-child{border:0}.st b{display:block;font-size:16px;color:var(--ink)}.brief{background:#f6f1e7;border-left:4px solid var(--blue);margin:8px 0;padding:10px;font-size:14px;line-height:1.6}.card{background:#fff;border:1px solid var(--line);padding:13px 12px;margin:8px 0}.sec{font-size:11px;color:var(--red);font-weight:700}.card h2{font-family:"Yu Mincho",serif;font-size:20px;line-height:1.35;margin:5px 0}.meta,.src{font-size:11px;color:var(--muted)}.body{font-family:"Yu Mincho",serif;font-size:14px;line-height:1.7;margin:9px 0}.buttons{display:flex;gap:8px;margin-top:10px}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:#f7f2e8;border-radius:8px;min-height:46px;font-weight:700;font-size:14px}.pick{flex:1}.pick.a{background:var(--red);color:white;border-color:var(--red)}.pick.b{background:var(--blue);color:white;border-color:var(--blue)}.tray{position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(255,253,247,.98);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px #0002}.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}.slot{height:42px;background:white;border:1px solid var(--line);padding:5px 7px;overflow:hidden;font-size:10px;color:var(--muted)}.slot b{display:block;color:var(--ink);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.pub{width:100%;height:46px;margin-top:6px;background:#191919;color:#fff;border:0}.pub:disabled{opacity:.35}.cover{position:fixed;inset:0;z-index:20;background:#17130fbb;display:flex;align-items:flex-end}.modal{background:var(--paper);width:100%;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom))}.modal h1{font-family:"Yu Mincho",serif;font-size:26px;margin:0 0 8px}.modal p{font-size:14px;line-height:1.7}.go{width:100%;background:var(--red);color:#fff;border:0;margin-top:10px}.signal{background:#f4efe5;border-left:4px solid var(--blue);padding:9px 10px;margin:7px 0;font-size:14px;line-height:1.5}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;border:1px solid var(--line);background:#fff;padding:5px 7px}.hidden{display:none!important}
</style></head><body><div class="wrap"><div class="head"><span class="day" id="day">DAY 1 / 5</span><div class="title">今日のニュース</div><div class="stats"><div class="st"><b id="readers">52</b>読者</div><div class="st"><b id="trust">55</b>信頼</div><div class="st"><b id="money">45</b>経営</div><div class="st"><b id="tension">28</b>緊張</div></div></div><div class="brief" id="brief"></div><main id="cards"></main></div>
<div class="tray"><div class="slots"><div class="slot">一面<b id="s1">未選択</b></div><div class="slot">二番手<b id="s2">未選択</b></div></div><button class="pub" id="pub" disabled>この紙面で発行する</button></div>
<div class="cover" id="intro"><div class="modal"><h1>5日間だけ、編集長になる。</h1><p>毎日5本の記事が届く。載せられるのは2本だけ。</p><p><b>売れる記事、確かな記事、街に必要な記事は、しばしば一致しない。</b>昨日の小さな記事が、後で別の記事として戻ることもある。</p><button class="go" id="start">編集部に入る</button></div></div>
<div class="cover hidden" id="result"><div class="modal" id="resultBox"></div></div>
<script>
const D=[
{b:"月曜。市長が北岸再開発を発表。今週は部数を落とすな、とだけ言われた。",a:[
["市政","北岸再開発、ノヴァが新工場","市長会見／ノヴァ広報","雇用800人を見込む。企業側は環境配慮型の設備だと強調。",[2,1,4,-1],"mayor"],
["地域","川沿いで魚の大量死　原因不明","釣り人／清掃員","北岸の排水口下流で小魚が多数浮いていた。市は異常報告なしと回答。",[1,2,-1,2],"fish"],
["事件","駅前で財布抜き相次ぐ？","SNS投稿／被害届未確認","黒い帽子の男にぶつかられた後、財布がないという投稿が拡散中。",[5,-3,2,4],"theft"],
["街","亀屋ベーカリー、創業50年","店主／常連客","北岸商店街の小さな店。先代のあんバターが今も人気。",[1,1,1,-2],"bread"],
["生活","今夜から激しい雨","気象台","深夜に強い雨。低地の浸水と河川増水に注意。",[0,3,0,1],"rain"]]},
{b:"火曜。昨夜の雨で川は濁る。昨日の紙面について電話が増えた。",a:[
["調査","北岸の水から溶剤成分","大学水質研究室","工業用洗浄剤にも使われる成分を微量検出。発生源は未特定。",[3,4,-2,3],"water"],
["経済","ノヴァ、新工場に環境投資20億円","ノヴァ社資料／広告主","排水再利用設備などを導入すると発表。",[1,-1,6,-1],"ad"],
["生活","小学校で児童11人が腹痛","学校／保護者","北岸第二小で11人が早退。保健所が聞き取りを開始。",[4,2,0,3],"school"],
["事件","財布抜き、確認できた被害届は1件","警察発表","SNSで拡散した複数被害のうち確認できた届けは1件。",[0,3,0,-2],"correct"],
["街","50周年の亀屋、雨でも行列","現地取材","新聞を見て来た客が多く、限定パンは昼前に完売。",[2,1,2,-2],"bread2"]]},
{b:"水曜。『北岸の件を追え』と『不安を煽るな』が半々。",a:[
["調査","給食業者、ノヴァ系列と判明","法人登記","北岸第二小の給食業者は3年前にノヴァの完全子会社になっていた。",[4,5,-3,4],"supplier"],
["市政","市長後援会にノヴァ幹部から300万円","政治資金報告書","昨年、役員3人から計300万円。市長側は適正な寄付と説明。",[5,4,-4,5],"donation"],
["事件","『黒い帽子の男』本人が被害訴え","本人／弁護士","窃盗犯として顔写真を拡散された男性が仕事を休んでいる。",[3,3,0,1],"harm"],
["地域","住民30人、市に調査要求","現地取材","魚の大量死などを受け第三者調査を要求。",[2,2,-1,4],"protest"],
["街","図書館の迷い猫『部長』正式採用","市立図書館","来館者の募金で健康診断。名前は投票で決定。",[3,1,2,-4],"cat"]]},
{b:"木曜。ノヴァから広告契約を『話したい』と連絡。水野記者は徹夜明け。",a:[
["特報","内部文書『旧排水設備、基準超過の恐れ』","元社員／内部文書","豪雨時に基準超過の恐れ、と記された点検表を入手。真正性は未確認。",[8,6,-8,7],"memo"],
["市政","市『健康被害との因果関係なし』","市長会見／保健所","現段階で共通原因を示すデータはないと説明。",[1,1,1,-4],"calm"],
["社内","ノヴァ、本紙広告を再検討","営業部","広告収入の14％を占める出稿を見直す意向。",[-1,0,5,0],"pressure"],
["生活","腹痛の児童、全員回復","保健所／学校","食中毒の可能性は低い。河川との関連は不明。",[0,4,0,-3],"recover"],
["社会","駅前窃盗騒動、男性へ謝罪相次ぐ","本人／SNS","写真を投稿した複数アカウントが削除・謝罪。",[1,4,0,-2],"apology"]]},
{b:"金曜。締切まで6時間。北岸をめぐる情報が一気に集まった。",a:[
["一面候補","北岸の異変、一本の線に","本紙取材／登記／内部文書","魚、溶剤、市との関係、旧設備文書を時系列で検証。児童腹痛との因果は確認できず。",[9,8,-10,6],"expose"],
["市政","市長『憶測が投資を遠ざける』","市長インタビュー","雇用と税収効果を強調。証拠のない疑念で街の未来を止めるなと主張。",[4,-1,6,-3],"city"],
["経済","ノヴァ、旧工場を自主点検へ","ノヴァ社発表","外部機関へ点検を委託。結果は必要に応じて公表。",[2,2,3,-2],"nova"],
["人物","『川でまた釣りがしたい』","最初の通報者親子","魚の異変を最初に知らせたのは小学4年生だった。",[3,3,0,-1],"human"],
["速報","週末、記録的大雨のおそれ","気象台／市防災課","線状降水帯の可能性。北岸などに自主避難所を開設。",[1,6,0,2],"storm"]]}];
let g={d:0,s:[null,null],st:[52,55,45,28],flags:new Set(),hist:[]};
const names=["読者","信頼","経営","緊張"];const $=x=>document.getElementById(x);
function render(){ $("day").textContent="DAY "+(g.d+1)+" / 5";$("brief").textContent=D[g.d].b;["readers","trust","money","tension"].forEach((id,i)=>$(id).textContent=Math.round(g.st[i]));$("cards").innerHTML="";D[g.d].a.forEach((a,i)=>{let e=document.createElement("article");e.className="card";e.innerHTML='<div class="sec">'+a[0]+'</div><h2>'+a[1]+'</h2><div class="meta">情報源：'+a[2]+'</div><div class="body">'+a[3]+'</div><div class="buttons"><button class="pick '+(g.s[0]===i?"a":"")+'" data-i="'+i+'" data-s="0">一面に置く</button><button class="pick '+(g.s[1]===i?"b":"")+'" data-i="'+i+'" data-s="1">二番手に置く</button></div>';e.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(+b.dataset.i,+b.dataset.s));$("cards").appendChild(e)});slot()}
function pick(i,s){let o=s?0:1;if(g.s[s]===i)g.s[s]=null;else{if(g.s[o]===i)g.s[o]=null;g.s[s]=i}render()}
function slot(){[0,1].forEach(s=>{let i=g.s[s];$("s"+(s+1)).textContent=i==null?"未選択":D[g.d].a[i][1]});$("pub").disabled=g.s.includes(null)}
function reactions(day,ids){let f=ids.map(i=>D[day].a[i][5]),r=[];if(day===0){if(f.includes("fish"))r.push("川の記事を見た読者から追加情報。水野記者が水を大学へ持ち込んだ。");else r.push("魚の大量死は地域SNSでだけ小さく話題になった。");if(f.includes("theft"))r.push("黒い帽子の男性の写真が急速に拡散した。");if(f.includes("rain"))r.push("深夜の大雨。避難情報を切り抜いたという読者メール。")}if(day===1){if(f.includes("water"))r.push("市が北岸の追加採水を決めた。");if(f.includes("school"))r.push("保護者から給食業者を調べてほしいとの情報。");if(f.includes("correct"))r.push("駅前の警戒は少し和らいだ。")}if(day===2){if(f.includes("supplier")||f.includes("donation"))r.push("『魚、給食、再開発はつながる？』と問い合わせが急増。");if(f.includes("harm"))r.push("写真を拡散された男性から短い礼状。");if(f.includes("cat"))r.push("猫『部長』が本紙SNSで今週最多反応。")}if(day===3){if(f.includes("memo"))r.push("県が旧工場への立入確認を検討。他紙も追随。");if(f.includes("pressure"))r.push("営業部は広告維持の可能性に安堵。編集部では議論に。");if(f.includes("recover"))r.push("学校周辺の不安は下がった。")}if(day===4){if(f.includes("expose"))r.push("県は週明けに旧工場を立入確認すると発表。");if(f.includes("storm"))r.push("避難所情報が広まり、早めに移動する住民が増えた。");if(f.includes("human"))r.push("『この一週間が初めて人の話に見えた』という感想。")}return r.slice(0,3)}
$("pub").onclick=()=>{let before=[...g.st],ids=[...g.s];ids.forEach((i,k)=>{let a=D[g.d].a[i];a[4].forEach((v,j)=>g.st[j]+=v*(k?0.75:1.35));g.flags.add(a[5])});if(g.d===1&&g.flags.has("theft")&&!ids.map(i=>D[1].a[i][5]).includes("correct")){g.st[1]-=2;g.st[3]+=1}if(g.d===2&&ids.map(i=>D[2].a[i][5]).includes("supplier")&&ids.map(i=>D[2].a[i][5]).includes("donation"))g.flags.add("chain");if(g.d===3&&g.flags.has("chain")&&ids.map(i=>D[3].a[i][5]).includes("memo"))g.flags.add("complete");if(g.d===4&&ids.map(i=>D[4].a[i][5]).includes("expose")&&!g.flags.has("complete"))g.st[1]-=3;g.st=g.st.map(x=>Math.max(0,Math.min(100,x)));g.hist.push(ids.map(i=>D[g.d].a[i][1]));let rs=reactions(g.d,ids),diff=g.st.map((x,i)=>x-before[i]);$("resultBox").innerHTML='<div style="font-size:11px;color:#777">DAY '+(g.d+1)+' 発行後</div><h1>翌朝、街はこうなった。</h1>'+rs.map(x=>'<div class="signal">'+x+'</div>').join("")+'<div class="pills">'+diff.map((v,i)=>Math.abs(v)>.1?'<span class="pill">'+names[i]+" "+(v>0?"+":"")+Math.round(v)+'</span>':"").join("")+'</div><button class="go" id="next">'+(g.d<4?"翌日の編集部へ":"5日間を振り返る")+'</button>';$("result").classList.remove("hidden");$("next").onclick=()=>{if(g.d<4){$("result").classList.add("hidden");g.d++;g.s=[null,null];render();scrollTo(0,0)}else ending()}}
function ending(){let t="編集者の新聞",d="売上、確度、人間の話、街への影響。その日ごとに基準を変えながら5日間を走り切った。";if(g.flags.has("expose")&&g.flags.has("complete")){t="検証する新聞";d="断片を積み上げてから大きく報じた。世界を動かしたのは派手な一発より、数日かけた積み重ねだった。"}else if(g.flags.has("storm")&&g.st[1]>=60){t="生活を守る新聞";d="大事件だけでなく、いま必要な情報を紙面に残した。"}$("resultBox").innerHTML='<h1>'+t+'</h1><p>'+d+'</p><p><b>あなたの一面</b></p>'+g.hist.map((x,i)=>'<div class="signal">DAY '+(i+1)+'　'+x[0]+'</div>').join("")+'<div class="pills">'+g.st.map((v,i)=>'<span class="pill">'+names[i]+" "+Math.round(v)+'</span>').join("")+'</div><button class="go" onclick="location.reload()">最初から遊ぶ</button>'}
$("start").onclick=()=>$("intro").classList.add("hidden");render();
</script></body></html>
